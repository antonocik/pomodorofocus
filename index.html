<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PomodoroFocus — Timer Produktivitas</title>
  <meta name="description" content="PomodoroFocus: timer produktivitas teknik Pomodoro dengan pengaturan durasi kustom dan notifikasi suara.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f87171'/%3E%3Cpath d='M6 4h20v4H6zM6 12h20v4H6zM6 20h20v4H6z' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="app-head">
      <div class="brand">
        <div class="brand__mark">PF</div>
        <h1>PomodoroFocus</h1>
      </div>
    </header>

    <main>
      <div class="timer-display" id="timer">25:00</div>

      <div class="controls">
        <button class="btn" id="startBtn">Mulai</button>
        <button class="btn--ghost" id="resetBtn">Reset</button>
      </div>

      <label for="mode" style="display:block;margin:24px 0 8px;font-size:.9rem;color:var(--muted)">Pilih mode</label>
      <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:24px">
        <button class="btn--secondary" id="work5">5m</button>
        <button class="btn--secondary" id="work25" style="background:var(--accent)">25m</button>
        <button class="btn--secondary" id="break5">5m istirahat</button>
        <button class="btn--secondary" id="break10">10m istirahat</button>
      </div>

      <div class="sessions">
        <div class="session"><span class="session__num" id="sessions">0</span><span class="session__label">Selesai</span></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
